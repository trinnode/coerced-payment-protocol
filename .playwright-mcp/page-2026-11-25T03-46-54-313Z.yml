  - main [ref=f1e17]:
    - generic [ref=f1e19]:
      - generic [ref=f1e20]:
        - paragraph [ref=f1e21]: Open design record · v0.1 · 25 Nov 2026
        - heading "Somebody is standing over the phone." [level=1] [ref=f1e22]
        - generic [ref=f1e23]:
          - paragraph [ref=f1e24]: "Not a hacker. A person in the room — at a checkpoint, in a parked car, in a family house. The transfer is made with the victim's own PIN, on their own device. Every control the bank ran passed, because the bank asked the right question of the wrong fact: did this person authorise it? They did. Were they free to refuse? Nobody asked."
          - paragraph [ref=f1e25]: This is the gap we are working on. Not better authentication — authentication already works. A way to say, in the few seconds that matter, that the PIN was given under threat. And a way for the receiving institution to learn it before the cash leaves.
        - generic [ref=f1e26]:
          - link "Read the assessment →" [ref=f1e27] [cursor=pointer]:
            - /url: /assessment
            - text: Read the assessment
            - generic [ref=f1e28]: →
          - link "Open the working console" [ref=f1e29] [cursor=pointer]:
            - /url: /console/login
      - generic [ref=f1e30]:
        - paragraph [ref=f1e31]: One sentence
        - paragraph [ref=f1e32]: The design aims to tell the receiving bank that a PIN may have been given under threat. It cannot say who was at fault — and no institution has implemented it yet.
        - paragraph [ref=f1e33]: The platform cannot hold money, freeze an account, start a transfer, or refer anyone to the police. That is not a limitation we will fix later. It is the design.
