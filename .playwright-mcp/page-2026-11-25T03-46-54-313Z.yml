    - generic [ref=f1e96]:
      - generic [ref=f1e97]:
        - paragraph [ref=f1e98]: § 02 · The problem
        - heading "The money moves in seconds. The process moves in weeks." [level=2] [ref=f1e99]
        - generic [ref=f1e100]:
          - paragraph [ref=f1e101]: NIP transfers settle in seconds. When a person is forced to make one, the victim's complaint, the bank's investigation, and the dispute process all begin after the fact. By then the receiving account has usually emptied.
          - paragraph [ref=f1e102]: The obvious answer — build a better dispute rail — runs into an uncomfortable fact. NIBSS's existing dispute system, IDRS, is built around issuers, acquirers and cards. It handles representment, arbitration and acquirer-initiated refunds. There is no equivalent account-to-account path for a transfer that was technically authorised and substantively forced.
          - paragraph [ref=f1e103]: "So the work is not to invent a new rail. It is to make the first sixty seconds count: get a minimal, signed signal from the sending institution to the receiving one, and give a human there something they can lawfully act on."
      - complementary [ref=f1e104]:
        - paragraph [ref=f1e105]: What exists today
        - list [ref=f1e106]:
          - listitem [ref=f1e107]:
