      - generic [ref=f1e172]:
        - generic [ref=f1e173]:
          - paragraph [ref=f1e174]: Things we will not build
          - list [ref=f1e175]:
            - listitem [ref=f1e176]:
              - generic [ref=f1e177]: "01"
              - generic [ref=f1e178]:
                - heading "We will not fake a receipt or a balance." [level=3] [ref=f1e179]
                - paragraph [ref=f1e180]: SMS and push alerts are generated below the app. Suppress one and the absence is louder than the message. Falsify a balance and the bank has falsified its own books. The transfer stays visible. We conceal the signal, never the money.
            - listitem [ref=f1e181]:
              - generic [ref=f1e182]: "02"
              - generic [ref=f1e183]:
                - heading "We will not freeze an account on a signal." [level=3] [ref=f1e184]
                - paragraph [ref=f1e185]: A signal is not proof and proof is not a verdict. A hold needs a named legal power, a value cap, a time cap, and someone accountable. Those are negotiated before a case exists, not during one.
            - listitem [ref=f1e186]:
              - generic [ref=f1e187]: "03"
              - generic [ref=f1e188]:
                - heading "We will not make a discretionary police referral." [level=3] [ref=f1e189]
                - paragraph [ref=f1e190]: The modal reported case involves a person with perceived authority — sometimes an agent. An automatic referral can expose the victim to the very person holding them. Statutory reporting to the NFIU under MLPPA 2022 is a separate, disclosed duty of the institution. It is not our feature.
            - listitem [ref=f1e191]:
              - generic [ref=f1e192]: "04"
              - generic [ref=f1e193]:
                - heading "We will not score a person as guilty." [level=3] [ref=f1e194]
                - paragraph [ref=f1e195]: No labels on recipients, no corridor scoring, no ethnicity proxies hiding inside a column called ‘risk’. A falsely restricted recipient is a real person with a real complaint.
            - listitem [ref=f1e196]:
              - generic [ref=f1e197]: "05"
              - generic [ref=f1e198]:
                - heading "We will not claim it works before it has been tried." [level=3] [ref=f1e199]
                - paragraph [ref=f1e200]: The decisive test is not a simulator. It is one bank's staging replica, paired normal and duress trials, and people paid to tell the difference. If more than one in five can, the claim dies.
        - generic [ref=f1e201]:
          - paragraph [ref=f1e202]: Known exclusions
          - paragraph [ref=f1e203]: This is a feature for smartphone banking customers in a defined value band. It does not protect everyone, and the people it does not protect are often the most exposed.
