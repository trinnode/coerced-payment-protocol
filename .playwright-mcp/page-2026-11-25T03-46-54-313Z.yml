    - generic [ref=f1e121]:
      - paragraph [ref=f1e122]: § 03 · The design
      - heading "Three loops, at three speeds." [level=2] [ref=f1e123]
      - paragraph [ref=f1e124]: The original playbook built the third loop and called it the product. A complaint system that works in a week is not useful to someone whose money left in four seconds. The order matters.
      - generic [ref=f1e133]:
        - article [ref=f1e134]:
          - generic [ref=f1e135]:
            - paragraph [ref=f1e136]: "01"
            - paragraph [ref=f1e137]: seconds
          - generic [ref=f1e138]:
            - heading "Signal" [level=3] [ref=f1e139]
            - paragraph [ref=f1e140]: inside the sending institution
            - paragraph [ref=f1e141]: A second PIN entry, inside a value band where no step-up exists at all. The design requires duress and ordinary transfers to produce the same request, the same alert, the same statement line — no bypass flag and no extra channel. Whether a real bank can achieve that is the Gate 0 experiment; it may fail.
            - paragraph [ref=f1e142]: Does not. It does not hide the transfer. The victim sees the debit like any other debit. Concealing the money is both impossible and wrong.
        - article [ref=f1e143]:
          - generic [ref=f1e144]:
            - paragraph [ref=f1e145]: "02"
            - paragraph [ref=f1e146]: minutes
          - generic [ref=f1e147]:
            - heading "Preservation" [level=3] [ref=f1e148]
            - paragraph [ref=f1e149]: sending institution → receiving institution
            - paragraph [ref=f1e150]: "A signed, minimal event crosses to the receiving side: institution, episode, a bank-authenticated confidence, the value band. No name, no account number, no location, no free text. The receiving institution decides what to do under its own standing rules — a lien, a positive pay directive, an injunction — each to be named and approved before any case, not improvised during one."
            - paragraph [ref=f1e151]: Does not. It does not freeze anything. Our first pilot proves fast human referral, not a hold. The hold rule comes later, after there is evidence to negotiate with.
        - article [ref=f1e152]:
          - generic [ref=f1e153]:
            - paragraph [ref=f1e154]: "03"
            - paragraph [ref=f1e155]: hours to weeks
          - generic [ref=f1e156]:
            - heading "Accountability" [level=3] [ref=f1e157]
            - paragraph [ref=f1e158]: inside each institution, then between them
            - paragraph [ref=f1e159]: One coercion can produce several transfers. We group them in one episode, attach each signed event, and write the authority reference beside every decision. Recipients can challenge without the notification endangering the sender. The record is destroyed at closure unless a named statute requires retention — a history of ‘this person was coerced’ is a standing target, not an asset.
            - paragraph [ref=f1e160]: Does not. It does not decide who was at fault. The platform holds facts and states; it never holds a verdict.
    - generic [ref=f1e162]:
      - generic [ref=f1e163]:
        - generic [ref=f1e164]:
          - paragraph [ref=f1e165]: § 04 · Hard cases
          - heading "A safety feature that protects the least exposed is a marketing artefact." [level=2] [ref=f1e166]
          - paragraph [ref=f1e167]: Every refusal below was proposed, taken seriously, and removed after an independent review. Every exclusion below is someone we do not reach. Both are printed before any invitation to work with us.
        - generic [ref=f1e168]:
          - paragraph [ref=f1e169]: In the record
          - paragraph [ref=f1e170]: The review log is public. If you think one of these refusals is wrong, that is exactly the argument we want to have.
          - link "Read the review log →" [ref=f1e171] [cursor=pointer]:
