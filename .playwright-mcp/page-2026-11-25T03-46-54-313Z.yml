    - generic [ref=f1e232]:
      - paragraph [ref=f1e233]: § 06 · The sequence
      - heading "Four gates. The default at each one is no." [level=2] [ref=f1e234]
      - paragraph [ref=f1e235]: "Each gate has criteria fixed before the work starts. The cheapest falsifiable claim goes first: whether anyone will pay, before whether it can be built."
      - generic [ref=f1e238]:
        - generic [ref=f1e239]:
          - heading "Gate −1 · Will anyone pay?" [level=3] [ref=f1e243]
          - generic [ref=f1e245]:
            - paragraph [ref=f1e246]: 30 days · ~£2.5k · not started
            - paragraph [ref=f1e247]: "Ten meetings: four tier-1 banks, four MMOs and PSPs, two insurers. One ask — sign six months, or name the number and the budget cycle. Pass at two signatures or three named figures from named budget holders. Zero is an answer, and it costs £2,500 rather than a year."
        - generic [ref=f1e248]:
          - heading "Gate 0 · Buildable and lawful?" [level=3] [ref=f1e252]
          - generic [ref=f1e254]:
            - paragraph [ref=f1e255]: 90 days · ~£6k
            - paragraph [ref=f1e256]: "A scoped counsel memo on licensing, lawful basis, hold powers and duty of care. A bank mobile-auth and notification engineer confirming the band-scoped path in writing. And the staging-replica paired trial — pre-registered kill at 20% detection. Any one fails: stop, or pivot to the accountability-only product."
        - generic [ref=f1e257]:
          - heading "Pilot · One institution" [level=3] [ref=f1e261]
          - generic [ref=f1e263]:
            - paragraph [ref=f1e264]: 6 months · £150–300k
            - paragraph [ref=f1e265]: One corridor, capped value, staff-supervised. Measured in minutes to notice and unsafe-contact incidents — not alerts sent. The first version proves fast referral, because a hold rule needs evidence to negotiate with and does not exist yet. Any unsafe contact pauses the pilot and triggers independent review.
        - generic [ref=f1e266]:
          - heading "Phase 2 · Second institution" [level=3] [ref=f1e270]
          - generic [ref=f1e272]:
            - paragraph [ref=f1e273]: months 10–18
            - paragraph [ref=f1e274]: A different core and auth stack, so the protocol is not one bank's internal API. Then — and only then — the standing hold rule, with a named power, a value cap, a duration cap, and a route for the recipient to challenge.
    - generic [ref=f1e276]:
      - paragraph [ref=f1e277]: § 07 · An invitation
      - paragraph [ref=f1e278]: Nothing here is proven. Tell us where it is wrong.
