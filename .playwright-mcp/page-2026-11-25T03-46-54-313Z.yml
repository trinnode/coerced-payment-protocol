    - generic [ref=f1e60]:
      - generic [ref=f1e61]:
        - paragraph [ref=f1e62]: § 01 · What crosses
        - heading "The signal is smaller than you think." [level=2] [ref=f1e63]
        - paragraph [ref=f1e64]: No name. No account number. No location. No note about what happened — that note could be read by someone standing over the phone.
        - paragraph [ref=f1e65]: What crosses is an institution, an episode, an event type, a bank-authenticated confidence, a value band, and a signature. Six fields, one of which is proof that the others came from a bank. Everything else stays where the victim is.
        - paragraph [ref=f1e66]: Specimen only. Events posted to /api/v1/events are signature-verified.
