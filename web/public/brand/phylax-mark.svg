<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-labelledby="title">
  <title id="title">Phylax — guard mark</title>
  <!-- The shield is deliberately broken at bowl height. The signal leaves
