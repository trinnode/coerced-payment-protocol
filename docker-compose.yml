services:
  db:
    image: postgres:17-alpine
    container_name: phylax-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: phylax
      POSTGRES_PASSWORD: phylax
      POSTGRES_DB: phylax
    ports:
      - "5433:5432"
    volumes:
      - phylax-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phylax -d phylax"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  phylax-db:
